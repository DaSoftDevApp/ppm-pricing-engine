version: '3.8'
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: adeo_user
      POSTGRES_PASSWORD: adeo_password
      POSTGRES_DB: ppm_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: 'postgresql://adeo_user:adeo_password@postgres:5432/ppm_db?schema=public'
    depends_on:
      - postgres
    # Sécurité supplémentaire : on force le conteneur à être en lecture seule
    # et on empêche l'escalade de privilèges
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
